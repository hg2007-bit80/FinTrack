services:
  # MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: fintrack-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fintrack-network

  # Backend REST API + Socket.IO Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://gawadeharsh1402_db_user:JchXYswF5YIQ1Toh@cluster0.1hwhxhz.mongodb.net/fintrack?retryWrites=true&w=majority
      - JWT_SECRET=fintrack_jwt_super_secret_key_2026
      - JWT_EXPIRE=7d
    depends_on:
      - mongo
    networks:
      - fintrack-network

  # Frontend React (Vite + Nginx) Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: fintrack-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fintrack-network

volumes:
  mongo-data:
    driver: local

networks:
  fintrack-network:
    driver: bridge
